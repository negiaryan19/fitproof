[project]
name = "fitproof"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
 "httpx>=0.28,<1", "langgraph>=1,<2", "beautifulsoup4>=4.12,<5",
 "pypdf>=5,<7"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

